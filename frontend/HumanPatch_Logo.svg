<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2F1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="10" y="10" width="180" height="180" rx="42" ry="42" fill="url(#bg)"/>

  <!-- Subtle dot grid (cyber feel) -->
  <g fill="#FFFFFF" opacity="0.08">
    <circle cx="30" cy="30" r="1.4"/>
    <circle cx="170" cy="30" r="1.4"/>
    <circle cx="30" cy="170" r="1.4"/>
    <circle cx="170" cy="170" r="1.4"/>
    <circle cx="100" cy="20" r="1.4"/>
    <circle cx="100" cy="180" r="1.4"/>
    <circle cx="20" cy="100" r="1.4"/>
    <circle cx="180" cy="100" r="1.4"/>
  </g>

  <!-- Shield path (centered, white) -->
  <g filter="url(#shadow)">
    <path d="M100 38
             L152 56
             L152 102
             C152 134 130 156 100 164
             C70 156 48 134 48 102
             L48 56
             Z"
          fill="url(#shield)"
          stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- Inner checkmark (cyber = verified safety) -->
  <path d="M76 100 L94 118 L126 80"
        fill="none"
        stroke="#0D9488"
        stroke-width="10"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Small human silhouette inside (the "patch") -->
  <circle cx="100" cy="84" r="7" fill="#0F172A"/>
  <path d="M88 102 C88 94 95 90 100 90 C105 90 112 94 112 102"
        fill="none" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round"/>
</svg>
